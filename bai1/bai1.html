<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Trang thơ Bốn mùa</title>
    <link rel="stylesheet" href="bai1.css">
</head>
<body>

    <div class="poem-card">
        <h1>BỐN MÙA</h1>

        <p class="stanza stanza-blue">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm<br>
        </p>

        <hr class="line-blue">

        <p class="stanza stanza-red">
              Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai<br>
        </p>

        <hr class="line-red">

        <p class="stanza stanza-blue">
              Một năm rồi lại một năm<br>
              Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </div>

</body>
</html>
